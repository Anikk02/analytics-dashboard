<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Analytics Dashboard</title>

    <link rel="stylesheet" href="styles.css">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <h1>Business Analytics Dashboard</h1>
        <p>Real-time insights from processed data pipeline</p>
    </header>

    <!-- CARDS -->
    <section class="cards">

        <div class="card">
            <h3>Total Revenue</h3>
            <p id="totalRevenue">--</p>
        </div>

        <div class="card">
            <h3>Top Customers</h3>
            <p id="topCustomerCount">--</p>
        </div>

        <div class="card">
            <h3>Regions</h3>
            <p id="regionCount">--</p>
        </div>

    </section>

    <!-- CHARTS -->
    <section class="charts">

        <div class="chart-box">
            <h2>Monthly Revenue Trend</h2>
            <canvas id="revenueChart"></canvas>
        </div>

        <div class="chart-box">
            <h2>Category Performance</h2>
            <canvas id="categoryChart"></canvas>
        </div>

    </section>

    <!-- TABLE -->
    <section class="table-section">

        <h2>Top Customers</h2>

        <table id="customersTable">
            <thead>
            <tr>
                <th>Name</th>
                <th>Region</th>
                <th>Total Spend</th>
                <th>Churned</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
